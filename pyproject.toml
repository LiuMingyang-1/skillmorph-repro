[project]
name = "skillmorph"
version = "0.1.0"
description = "Trajectory-guided fault localization for agent skill evolution (reproduction)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
